name: Bug report
description: Something is broken, errors out, or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using Library-DUF! The more detail you give, the faster it gets fixed.
  - type: input
    id: version
    attributes:
      label: Library-DUF version
      description: The release, tag, or commit you are using.
      placeholder: e.g. the latest main, or a release tag
    validations:
      required: true
  - type: input
    id: df-version
    attributes:
      label: DataFlex version
      description: The DataFlex version you are running or targeting.
      placeholder: e.g. DataFlex 2026 (26.0)
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we make it happen?
      placeholder: |
        1. Open '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Code / context
      description: Which workspace, program, or source line triggered it? Paste any compiler output or error text here.
      render: text
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / logs
      description: Drag in images or paste log snippets.
    validations:
      required: false
