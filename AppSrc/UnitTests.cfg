; UnitTests.cfg - project settings for the DFUnit test program.
;
; Manifest generation is off on purpose: the DFUnit README asks for it, because the
; Studio's manifest settings otherwise interfere with a console compile on a build
; server. Platform=x64 makes a command-line build produce UnitTests64.exe rather than
; silently falling back to 32-bit.
[Application]
IsWebApp=0
BuildManifestFile=0
EmbedManifestFile=0
DPIAware=1
AutoGenerateMenus=0
CompilerWarnings=1
[Compiler]
Platform=x64
64BitSuffix=64
32BitSuffix=
BeforeCompileProcessEnabled=0
AfterCompileProcessEnabled=0
[Version]
Include=0
AutoIncrementBuild=0
