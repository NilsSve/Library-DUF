; UnitTests.cfg - project settings for the DFUnit test program.
;
; Platform=x64 makes a command-line build produce UnitTests64.exe rather than silently
; falling back to 32-bit.
; The manifest is built and embedded: without it Windows gives the program the old common
; controls, and the buttons of the test-runner window show no images. A console run (-c)
; does not depend on it.
; Icon is the icon of the program file. The test-runner window brings its own images (DFUnit).
[Application]
IsWebApp=0
BuildManifestFile=1
EmbedManifestFile=1
DPIAware=1
AutoGenerateMenus=0
CompilerWarnings=1
Icon=UnitTesting.ico
[Compiler]
Platform=x64
64BitSuffix=64
32BitSuffix=
BeforeCompileProcessEnabled=0
AfterCompileProcessEnabled=0
BeforeCompileProcessCommand=
BeforeCompileProcessParameters=
AfterCompileProcessCommand=
AfterCompileProcessParameters=
[Version]
Include=0
AutoIncrementBuild=0
VersionMajor=1
VersionMinor=0
VersionRelease=0
VersionBuild=1
ModuleSpecialBuild=0
ModulePrivateBuild=0
Comments=
CompanyName=
FileDescription=
InternalName=
LegalCopyright=
LegalTrademarks=
OriginalFilename=
ProductName=
ProductVersion=
SpecialBuild=
PrivateBuild=
